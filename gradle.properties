# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 4 GB of RAM (1 GB made the daemon run out of memory and restart, losing its warm state)
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

# Reuse outputs between builds and Android Studio restarts. The cache lives in %USERPROFILE%\.gradle\caches,
# outside OneDrive, so it survives even if the project's own build folders are cleared.
org.gradle.caching=true
# Build modules (FtcRobotController, TeamCode) at the same time
org.gradle.parallel=true
# Keep a background Gradle process alive between builds (default, stated explicitly)
org.gradle.daemon=true

android.nonTransitiveRClass=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
